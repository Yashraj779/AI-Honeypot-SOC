<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobalSecure™ | Restricted Access Gateway</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <!-- Animated background elements -->
  <div class="bg-grid"></div>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="login-wrapper">
    <div class="warning-banner">
      <svg class="warning-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" />
      </svg>
      <span><strong>RESTRICTED SYSTEM:</strong> Unauthorized access is strictly prohibited and logged.</span>
    </div>

    <div class="login-card">
      <div class="card-header">
        <div class="logo-container">
          <svg class="lock-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>
        </div>
        <h2>GlobalSecure™ Gateway</h2>
        <div class="system-status">
          <span class="status-dot"></span>
          <span>System Online • Encrypted Connection</span>
        </div>
      </div>

      {% if error %}
      <div class="error-box">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="error-icon">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
        </svg>
        <span>Authentication Failed: {{ error }}</span>
      </div>
      {% endif %}

      <form method="POST">
        <div class="input-group">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
          </svg>
          <input type="text" name="username" placeholder="Admin Username" required autocomplete="off" />
        </div>

        <div class="input-group">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
          </svg>
          <input type="password" name="password" placeholder="Passcode / Security Key" required autocomplete="off" />
        </div>

        <button type="submit" id="loginBtn">
          <span class="btn-text">INITIALIZE SECURE CONNECTION</span>
          <div class="btn-loader" style="display: none;"></div>
        </button>
      </form>

      <div class="footer-text">
        IP Logged: <span id="client-ip">Scanning...</span><br>
        Session ID: <span id="session-id"></span>
      </div>
    </div>
  </div>

  <script>
    // Generate a random looking session ID
    document.getElementById('session-id').innerText = Math.random().toString(36).substring(2, 15).toUpperCase();
    
    // Simulate IP fetching to look legitimate
    setTimeout(() => {
        document.getElementById('client-ip').innerText = "192.168.1." + Math.floor(Math.random() * 255);
        document.getElementById('client-ip').style.color = "#ef4444";
    }, 1000);

    document.querySelector("form").addEventListener("submit", function(){
      let button = document.getElementById("loginBtn");
      let btnText = button.querySelector(".btn-text");
      let btnLoader = button.querySelector(".btn-loader");
      
      button.classList.add("authenticating");
      btnText.innerText = "VERIFYING CREDENTIALS...";
      btnLoader.style.display = "block";
      button.disabled = true;
    });
  </script>
</body>
</html>
